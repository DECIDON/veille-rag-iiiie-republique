# Par défaut on ne joue que les tests unitaires (aucune dépendance externe).
# Tests complets :  pytest -m ""   (make test-complet)
[pytest]
testpaths = tests
markers =
    integration : necessite Qdrant en service (docker compose up -d) et qdrant-client
    modele : telecharge et execute les vrais poids Hugging Face (bge-m3, ~2 Go)
    reseau : necessite Ollama en service (option 7)
addopts = -q -m "not integration and not modele and not reseau"
